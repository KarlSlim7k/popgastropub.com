events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Frontend (Next.js)
    server {
        listen 80;
        server_name popgastropub.com www.popgastropub.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            # Docker can recreate the frontend container with a new IP after deploys.
            # Use runtime DNS resolution so nginx does not keep a stale upstream address.
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Backend (Laravel API)
    server {
        listen 80;
        server_name api.popgastropub.com;

        client_max_body_size 8m;

        root /var/www/html/public;

        index index.php index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # Use variable to force runtime DNS re-resolution after redeploys.
            # Without this nginx caches the backend IP and returns 502 after container restarts.
            set $backend_upstream "backend:9000";
            fastcgi_pass $backend_upstream;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location /api/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Solo carpetas públicas (menu, promociones, recompensas) se sirven directo.
        # El resto (ej. tickets fiscales) vive en disco privado y NUNCA se expone aquí.
        location ~ ^/storage/(menu|promociones|recompensas)/(.+)$ {
            alias /var/www/html/storage/app/public/$1/$2;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }

        location /storage/ {
            return 404;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
