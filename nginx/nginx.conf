events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Frontend (Next.js)
    server {
        listen 80;
        server_name popgastropub.com www.popgastropub.com;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # CSP enforce (REM-02): politica holgada derivada del inventario de Fase 2.8.
        # Widget de reseñas migrado a SociableKit (REM-elfsight, cuenta Elfsight
        # alcanzo APP_VIEWS_LIMIT_REACHED): *.sociablekit.com cubre widgets.,
        # clicks., scrolls., views. (script/connect/img), pero el backend real de
        # datos/imagenes del widget vive en accentapi.com (api.accentapi.com,
        # data.accentapi.com), NO bajo sociablekit.com -> se agrega *.accentapi.com
        # a connect-src/img-src, si no el fetch de reseñas queda bloqueado por CSP
        # y el widget no renderiza nada en produccion. El widget tambien carga su
        # hoja de estilos principal de layout como <link> externo
        # (widgets.sociablekit.com/google-reviews/new/styles.css): 'unsafe-inline'
        # NO cubre stylesheets externos, hace falta el dominio en style-src; sin
        # esto el CSS de grid/cards/Swiper no aplica y el widget se renderiza
        # apilado/deforme sobre el hero. Ademas el CSS del feed inyecta @font-face
        # con la webfont de iconos en widgets.sociablekit.com (.woff2): sin
        # *.sociablekit.com en font-src la estrella de rating cae a fuente
        # fallback. Por eso style-src y font-src incluyen *.sociablekit.com
        # (+ *.accentapi.com por robustez).
        # SociableKit renderiza inline (sin iframe), por eso no aparece en frame-src.
        # Tambien incluye static.cloudflareinsights.com / *.cloudflareinsights.com
        # (script-src + connect-src: beacon de Cloudflare Web Analytics que
        # Cloudflare inyecta a nivel proxy en TODAS las paginas, bloqueado en
        # consola sin esto) y www.google.com en frame-src (el iframe de Google
        # Maps de /ubicacion usa maps.google.com pero CSP valida tambien el
        # destino del redirect interno a www.google.com). Ambos hallazgos
        # detectados con Playwright en la verificacion post-deploy de REM-02.
        # 'unsafe-inline' se mantiene en script-src/style-src: Next.js App Router
        # inyecta scripts/estilos inline; quitarlo requiere nonces (no trivial).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.sociablekit.com https://static.cloudflareinsights.com https://*.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.sociablekit.com https://*.accentapi.com; font-src 'self' https://fonts.gstatic.com data: https://*.sociablekit.com https://*.accentapi.com; img-src 'self' data: blob: https://api.popgastropub.com https://images.unsplash.com https://*.googleusercontent.com https://*.sociablekit.com https://*.accentapi.com; connect-src 'self' https://api.popgastropub.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.sociablekit.com https://*.accentapi.com https://cloudflareinsights.com https://*.cloudflareinsights.com; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # Report-Only: telemetria en consola para seguir endureciendo sin volver a
        # romper produccion. Incluye los mismos ajustes de cloudflareinsights y
        # www.google.com (necesarios en ambas politicas).
        # report-to / report-uri (V3-07, paso 1): envia los reportes de violacion
        # al endpoint propio /api/csp-report (backend), que los loguea para
        # observabilidad. No afecta la politica enforce de arriba.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.sociablekit.com https://static.cloudflareinsights.com https://*.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.sociablekit.com https://*.accentapi.com; font-src 'self' https://fonts.gstatic.com data: https://*.sociablekit.com https://*.accentapi.com; img-src 'self' data: blob: https://api.popgastropub.com https://images.unsplash.com https://*.googleusercontent.com https://*.sociablekit.com https://*.accentapi.com; connect-src 'self' https://api.popgastropub.com https://*.sociablekit.com https://*.accentapi.com https://cloudflareinsights.com https://*.cloudflareinsights.com; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-to csp-endpoint; report-uri https://api.popgastropub.com/api/csp-report" always;
        add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://api.popgastropub.com/api/csp-report"}]}' always;

        location / {
            # Docker can recreate the frontend container with a new IP after deploys.
            # Use runtime DNS resolution so nginx does not keep a stale upstream address.
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Backend (Laravel API)
    server {
        listen 80;
        server_name api.popgastropub.com;

        client_max_body_size 8m;

        root /var/www/html/public;

        index index.php index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # API: respuestas JSON, sin scripts/estilos propios (REM-02: enforce).
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # Use variable to force runtime DNS re-resolution after redeploys.
            # Without this nginx caches the backend IP and returns 502 after container restarts.
            set $backend_upstream "backend:9000";
            fastcgi_pass $backend_upstream;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location /api/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Solo carpetas públicas (menu, promociones, recompensas) se sirven directo.
        # El resto (ej. tickets fiscales) vive en disco privado y NUNCA se expone aquí.
        location ~ ^/storage/(menu|promociones|recompensas)/(.+)$ {
            alias /var/www/html/storage/app/public/$1/$2;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        }

        location /storage/ {
            return 404;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
