version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: pop_perote_mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=pop_perote
      - MYSQL_USER=pop_user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - pop_db_data:/var/lib/mysql
    networks:
      - pop_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.popgastropub.com/api}
    container_name: pop_perote_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.popgastropub.com/api}
    networks:
      - pop_network
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pop_perote_backend
    restart: unless-stopped
    expose:
      - "9000"
    command: >
      sh -c "mkdir -p /var/www/html/storage/app/private /var/www/html/storage/app/public /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/logs /var/www/html/bootstrap/cache && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache && php artisan migrate --force && php artisan tickets:migrate-to-private && php artisan storage:link --force 2>/dev/null || true && php-fpm"
    environment:
      - APP_ENV=production
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:?APP_KEY requerido}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=pop_perote
      - DB_USERNAME=pop_user
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=${CACHE_STORE:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - APP_URL=${APP_URL:-https://api.popgastropub.com}
      - FRONTEND_URL=${FRONTEND_URL:-https://popgastropub.com}
      - QR_SECRET=${QR_SECRET:?QR_SECRET requerido}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://api.popgastropub.com/api/auth/social/google/callback}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-https://api.popgastropub.com/api/auth/social/facebook/callback}
      - X_CLIENT_ID=${X_CLIENT_ID:-}
      - X_CLIENT_SECRET=${X_CLIENT_SECRET:-}
      - X_REDIRECT_URI=${X_REDIRECT_URI:-https://api.popgastropub.com/api/auth/social/x/callback}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY requerido}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY requerido}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mail.popgastropub.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_AUTO_TLS=${MAIL_AUTO_TLS:-true}
      - MAIL_VERIFY_PEER=${MAIL_VERIFY_PEER:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@popgastropub.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-POP Perote}
      - FACTURACION_EMAIL=${FACTURACION_EMAIL:-facturacion@popgastropub.com}
      - FACTURACION_CC=${FACTURACION_CC:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-noticias@popgastropub.com}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-POP Perote}
      - RESEND_NEWSLETTER_SEGMENT_ID=${RESEND_NEWSLETTER_SEGMENT_ID:-ff1c78e8-286e-4bca-959c-a19e542edb4b}
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    volumes:
      - pop_backend_storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pop_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || pgrep php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pop_perote_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:?APP_KEY requerido}
      - APP_URL=${APP_URL:-https://api.popgastropub.com}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=pop_perote
      - DB_USERNAME=pop_user
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=${CACHE_STORE:-file}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mail.popgastropub.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_AUTO_TLS=${MAIL_AUTO_TLS:-true}
      - MAIL_VERIFY_PEER=${MAIL_VERIFY_PEER:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@popgastropub.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-POP Perote}
      - FACTURACION_EMAIL=${FACTURACION_EMAIL:-facturacion@popgastropub.com}
      - FACTURACION_CC=${FACTURACION_CC:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-noticias@popgastropub.com}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-POP Perote}
      - RESEND_NEWSLETTER_SEGMENT_ID=${RESEND_NEWSLETTER_SEGMENT_ID:-ff1c78e8-286e-4bca-959c-a19e542edb4b}
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    volumes:
      - pop_backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
      mariadb:
        condition: service_healthy
    networks:
      - pop_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pop_perote_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    environment:
      - APP_ENV=production
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:?APP_KEY requerido}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=pop_perote
      - DB_USERNAME=pop_user
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=${CACHE_STORE:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - APP_URL=${APP_URL:-https://api.popgastropub.com}
      - FRONTEND_URL=${FRONTEND_URL:-https://popgastropub.com}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY requerido}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY requerido}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mail.popgastropub.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_AUTO_TLS=${MAIL_AUTO_TLS:-true}
      - MAIL_VERIFY_PEER=${MAIL_VERIFY_PEER:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@popgastropub.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-POP Perote}
      - FACTURACION_EMAIL=${FACTURACION_EMAIL:-facturacion@popgastropub.com}
      - FACTURACION_CC=${FACTURACION_CC:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-noticias@popgastropub.com}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-POP Perote}
      - RESEND_NEWSLETTER_SEGMENT_ID=${RESEND_NEWSLETTER_SEGMENT_ID:-ff1c78e8-286e-4bca-959c-a19e542edb4b}
      - SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    volumes:
      - pop_backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
      mariadb:
        condition: service_healthy
    networks:
      - pop_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: pop_perote_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - pop_backend_storage:/var/www/html/storage:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pop_network
      - dokploy-network
      - default
    labels:
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-web.rule=Host(`api.popgastropub.com`)
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-web.entrypoints=web
      - traefik.http.services.popperoteweb-sistemapopperote-4hogw4-4-web.loadbalancer.server.port=80
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-web.service=popperoteweb-sistemapopperote-4hogw4-4-web
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-web.middlewares=redirect-to-https@file
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-websecure.rule=Host(`api.popgastropub.com`)
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-websecure.entrypoints=websecure
      - traefik.http.services.popperoteweb-sistemapopperote-4hogw4-4-websecure.loadbalancer.server.port=80
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-websecure.service=popperoteweb-sistemapopperote-4hogw4-4-websecure
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-4-websecure.tls.certresolver=letsencrypt
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-web.rule=Host(`popgastropub.com`)
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-web.entrypoints=web
      - traefik.http.services.popperoteweb-sistemapopperote-4hogw4-3-web.loadbalancer.server.port=80
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-web.service=popperoteweb-sistemapopperote-4hogw4-3-web
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-web.middlewares=redirect-to-https@file
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-websecure.rule=Host(`popgastropub.com`)
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-websecure.entrypoints=websecure
      - traefik.http.services.popperoteweb-sistemapopperote-4hogw4-3-websecure.loadbalancer.server.port=80
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-websecure.service=popperoteweb-sistemapopperote-4hogw4-3-websecure
      - traefik.http.routers.popperoteweb-sistemapopperote-4hogw4-3-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true

networks:
  pop_network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  pop_db_data:
    driver: local
  pop_backend_storage:
    driver: local
